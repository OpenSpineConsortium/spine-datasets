# The living documentation site (docs/learn/README.md): the guide to the
# lessons, which live in symphony-protocol, the capabilities page, a
# reference made from the code's own docstrings and the test suite's
# results, built by tools/living_docs.py on every push to the default branch
# and published with GitHub Pages. The test report is written even when a
# test fails, so the Tests page shows the failure rather than hiding the
# page.
#
# Publishing needs Pages set to deploy from GitHub Actions, which the
# workflow's token cannot set, and the repository variable SYMPHONY_DOCS set
# to pages, so a site the owner publishes from another workflow is never
# overwritten; scripts/setup-repo.sh makes both (docs/learn/README.md,
# Publishing the site). The build also reads the Pages setting with the
# token's pages: read, so a copy whose plan has no Pages sees no red run:
# the site is built and kept as an artifact.
name: Docs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # a deploy stopped halfway leaves Pages between two versions
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
      issues: read
    outputs:
      pages: ${{ steps.pages.outputs.source }}
    steps:
      - name: Read whether Pages deploys from GitHub Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        # a repository with no Pages site answers 404, which means no deploy;
        # gh may print the error's body, so only the one word is passed on
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null) || source=none
          [ "$source" = workflow ] || source=none
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Clone symphony-protocol, as CI does, so the Tests page matches CI's run
        run: git clone --quiet https://github.com/OpenSpineConsortium/symphony-protocol "$RUNNER_TEMP/symphony-protocol"

      - name: Run the test suite for the Tests page
        continue-on-error: true
        env:
          SDLC_PROTOCOL: ${{ runner.temp }}/symphony-protocol
        run: python3 tools/living_docs.py report "$RUNNER_TEMP/tests.json"

      - name: Build the site
        env:
          SHA: ${{ github.sha }}
        run: python3 tools/living_docs.py site "$RUNNER_TEMP/site" --tests "$RUNNER_TEMP/tests.json" --repo "$GITHUB_REPOSITORY" --sha "$SHA"

      # The pipeline board (tools/pipeline.py) is served beside the site at
      # /pipeline.html, drawn from the records and the tasks as the Pipeline
      # board workflow draws it onto the branch pipeline.
      - name: Read the tasks for the pipeline board
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" --slurp | python3 -c 'import json,sys; print(json.dumps([i for page in json.load(sys.stdin) for i in page]))' > "$RUNNER_TEMP/issues.json"

      - name: Render the pipeline board into the site
        run: python3 tools/pipeline.py render --out "$RUNNER_TEMP/board" --issues "$RUNNER_TEMP/issues.json" --repo "$GITHUB_REPOSITORY" && cp "$RUNNER_TEMP/board/pipeline.html" "$RUNNER_TEMP/site/pipeline.html"

      # The census (tools/census.py) is served beside the site at /census.html,
      # folded from the records onto the ledger the Census workflow keeps on
      # the branch census, so the page carries each record's dates and the log
      # even when this push reaches the site before the Census run reaches the
      # branch. Before that branch exists the census starts afresh.
      - name: Render the census into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/census.json?ref=census" > "$RUNNER_TEMP/last-census.json" 2>/dev/null || rm -f "$RUNNER_TEMP/last-census.json"
          python3 tools/census.py render --out "$RUNNER_TEMP/census" --previous "$RUNNER_TEMP/last-census.json" --issues "$RUNNER_TEMP/issues.json" --repo "$GITHUB_REPOSITORY"
          cp "$RUNNER_TEMP/census/census.html" "$RUNNER_TEMP/site/census.html"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'workflow' && vars.SYMPHONY_DOCS == 'pages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
